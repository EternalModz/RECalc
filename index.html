<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RECalc reverse engineering calculator and converter">
    <title>RECalc</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>RECalc</h1>

        <label for="inputBox">Input Value:</label>
        <input type="text" id="inputBox" placeholder="Enter value (e.g., '0xFF', '0b1010', '255')" autocomplete="off" spellcheck="false" oninput="validateInput(this.value)">

        <div class="checkbox-container">
            <label>
                <input type="checkbox" id="textInputMode" onclick="toggleInputMode()"> Use text input (convert text to selected format)
            </label>
        </div>

        <label for="conversionType">Conversion Type:</label>
        <select id="conversionType" onchange="convert()">
            <option value="hex">Hexadecimal</option>
            <option value="dec">Decimal</option>
            <option value="bin">Binary</option>
            <option value="octal">Octal</option>
            <option value="base32">Base32</option>
            <option value="base64">Base64</option>
        </select>

        <button type="button" onclick="convert()">Convert</button>
        <div class="output" id="output" aria-live="polite">Result: </div>

        <label for="reverseInputBox">Reverse Translate:</label>
        <input type="text" id="reverseInputBox" placeholder="e.g., 0x48 0x65 0x6C 0x6C 0x6F" autocomplete="off" spellcheck="false">
        
        <label for="reverseFormat">Reverse Translate From:</label>
        <select id="reverseFormat" onchange="reverseTranslate()">
            <option value="hex">Hexadecimal</option>
            <option value="dec">Decimal</option>
            <option value="bin">Binary</option>
            <option value="octal">Octal</option>
            <option value="base32">Base32</option>
            <option value="base64">Base64</option>
        </select>

        <button type="button" onclick="reverseTranslate()">Reverse Translate</button>
        <div class="output" id="reverseOutput" aria-live="polite">Reversed Result: </div>

        <label for="mathBox">Math Expression:</label>
        <input type="text" id="mathBox" placeholder="e.g., 5 + 3 * 2 or 0x20 << 2" autocomplete="off" spellcheck="false">
        <button type="button" onclick="evaluateMath(document.getElementById('mathBox').value)">Evaluate</button>
        <div class="output" id="mathOutput" aria-live="polite">Math Result: </div>

        <button type="button" onclick="downloadOutput()">Download Results</button>
    </main>
</body>
</html>
